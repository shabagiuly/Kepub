<!doctype html>
<html lang="fr" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Ensure trailing slash on directory visits (e.g. /Kepub -> /Kepub/)
      try {
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      } catch (_) {}

      // Safe HMR error suppressor for dev environment
      try {
        var NativeWS = window.WebSocket;
        if (NativeWS) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') {
              var target = new EventTarget();
              target.readyState = 1;
              target.url = url;
              target.protocol = protocols;
              target.send = function() {};
              target.close = function() {};
              setTimeout(function() {
                try { target.dispatchEvent(new Event('open')); } catch (_) {}
              }, 0);
              return target;
            }
            return new NativeWS(url, protocols);
          };
          window.WebSocket.prototype = NativeWS.prototype;
          try {
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          } catch (_) {}
        }
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('vite') || (e.filename && e.filename.includes('@vite/client')))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && e.reason.message && (e.reason.message.includes('WebSocket') || e.reason.message.includes('vite'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      } catch (_) {}
    </script>
